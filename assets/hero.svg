<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" fill="none" role="img" aria-labelledby="t d">
  <title id="t">Murk — iOS tools, plugins and research</title>
  <desc id="d">Animated sakura-and-Unit-02 banner for Murk's GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f16"/>
      <stop offset="0.5" stop-color="#2a1020"/>
      <stop offset="1" stop-color="#140d1c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5c8a"/>
      <stop offset="0.5" stop-color="#ff8a7a"/>
      <stop offset="1" stop-color="#b79bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5c8a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5c8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="0.6"/></filter>
    <g id="petal">
      <path d="M0,-7 C4,-5 4,2 0,7 C-4,2 -4,-5 0,-7 Z" fill="#ff8fb0" opacity="0.9"/>
      <path d="M0,-7 C4,-5 4,2 0,7" fill="none" stroke="#ffd0dd" stroke-width="0.5" opacity="0.7"/>
    </g>
  </defs>

  <rect width="1100" height="300" rx="20" fill="url(#bg)"/>
  <circle cx="880" cy="70" r="240" fill="url(#glow)"/>
  <circle cx="180" cy="250" r="180" fill="url(#glow)" opacity="0.5"/>

  <!-- scanline grid -->
  <g stroke="#ff5c8a" stroke-width="0.5" opacity="0.08">
    <path d="M0 80 H1100 M0 150 H1100 M0 220 H1100"/>
    <path d="M250 0 V300 M550 0 V300 M850 0 V300"/>
  </g>

  <!-- falling petals -->
  <g>
    <use href="#petal" x="150" y="0">
      <animateTransform attributeName="transform" type="translate" values="0 -20; 30 320" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="4s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#petal" x="420" y="0" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 -40; -40 340" dur="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="5s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#petal" x="700" y="0" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 -10; 25 330" dur="6.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;320" dur="3.5s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#petal" x="980" y="0" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 -30; -30 350" dur="8.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="180;540" dur="4.5s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#petal" x="300" y="0" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 -60; 15 320" dur="10s" repeatCount="indefinite"/>
    </use>
    <use href="#petal" x="840" y="0" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 -50; -20 330" dur="7.5s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- title -->
  <text x="60" y="130" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#title)" letter-spacing="-1">murk</text>
  <text x="62" y="170" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="19" fill="#ffb3c6" opacity="0.95">iOS signing · sideloading · tweaks · kernel research</text>

  <!-- tagline chips -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="600">
    <g transform="translate(62,200)">
      <rect width="118" height="28" rx="14" fill="#ff5c8a" opacity="0.16"/>
      <text x="59" y="19" text-anchor="middle" fill="#ff8aa6">🎀 SayoSign</text>
    </g>
    <g transform="translate(190,200)">
      <rect width="104" height="28" rx="14" fill="#9b72cf" opacity="0.2"/>
      <text x="52" y="19" text-anchor="middle" fill="#c3a6ff">🔍 IPALens</text>
    </g>
    <g transform="translate(304,200)">
      <rect width="120" height="28" rx="14" fill="#2aabee" opacity="0.18"/>
      <text x="60" y="19" text-anchor="middle" fill="#7fd0f7">💬 VoidGram</text>
    </g>
    <g transform="translate(434,200)">
      <rect width="138" height="28" rx="14" fill="#ff8a7a" opacity="0.18"/>
      <text x="69" y="19" text-anchor="middle" fill="#ffab9e">🧬 kernel research</text>
    </g>
  </g>

  <!-- blinking cursor terminal line -->
  <g transform="translate(62,252)" font-family="ui-monospace, Menlo, monospace" font-size="14">
    <text fill="#6ee7a8">$</text>
    <text x="18" fill="#d9cfe6">building things that feel alive</text>
    <rect x="258" y="-11" width="8" height="15" fill="#ff5c8a">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- pilot emblem -->
  <g transform="translate(940,150)">
    <circle r="86" fill="none" stroke="#ff5c8a" stroke-width="2" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle r="86" fill="none" stroke="#ff5c8a" stroke-width="6" stroke-dasharray="4 30" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle r="66" fill="none" stroke="#9b72cf" stroke-width="2" stroke-dasharray="2 12" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="48" fill="#1a0f16" stroke="#ff5c8a" stroke-width="1.5" opacity="0.9"/>
    <text y="16" text-anchor="middle" font-size="46">🎀</text>
    <text y="-58" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#ff8aa6" opacity="0.8">UNIT-02</text>
  </g>
</svg>
