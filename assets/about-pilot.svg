  <text x="38" y="112" font-family="Arial,sans-serif" font-size="43" font-weight="900" letter-spacing="2" fill="#fff4fa">IDEAS → TOOLS → MORE IDEAS</text>
  <text x="41" y="145" font-family="monospace" font-size="16" letter-spacing="1" fill="#ffc4dc">iOS tinkering  ·  plugin making  ·  curious experiments</text>
  <path d="M40 166h535" stroke="url(#pink)" stroke-width="3"/>
  <text x="41" y="194" font-family="monospace" font-size="13" fill="#ffe6ef">BUILDING USEFUL THINGS, ONE SIDE QUEST AT A TIME ✦</text>
  <text x="41" y="218" font-family="monospace" font-size="11" fill="#cbb6d7">ASUKA ENERGY × NATSUKI SOFTNESS — ORIGINAL FAN-INSPIRED MOOD</text>
