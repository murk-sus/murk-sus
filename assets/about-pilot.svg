<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-labelledby="title desc">
  <title id="title">Murk's creative pilot profile</title>
  <desc id="desc">Original anime-inspired dashboard illustration with a small friendly pilot mascot, abstract mecha panels, and sakura decorations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#181421"/><stop offset=".58" stop-color="#302034"/><stop offset="1" stop-color="#492239"/></linearGradient>
    <linearGradient id="pink" x1="0" x2="1"><stop stop-color="#ff79ab"/><stop offset="1" stop-color="#d8a4ff"/></linearGradient>
    <linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ff594d"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#ffb4d2" stroke-opacity=".10"/></pattern>
  </defs>
  <rect x="4" y="4" width="1092" height="242" rx="20" fill="url(#bg)" stroke="#ff83b4" stroke-width="3"/>
  <rect x="14" y="14" width="1072" height="222" rx="14" fill="url(#grid)"/>
