name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=ff5c8a&color_dots=1a0f16,3a1d2a,7a3550,c05080,ff8aa6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=ff5c8a&color_dots=1a0f16,3a1d2a,7a3550,c05080,ff8aa6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
